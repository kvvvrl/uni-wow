<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8"/>
	<!--Google Fonts-->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap"
		  rel="stylesheet">
	<!---------------->
	<!--Font Awesome-->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<!---------------->
	<link rel="stylesheet" type="text/css" href="style/global_style.css"/>
	<link
			rel="stylesheet"
			type="text/css"
			href="style/moduluebersicht_style.css"
	/>
	<title>Uni-WOW</title>
	<script src="script/navbar.js"></script>
	<script src="script/ajax.js"></script>
	<script src="script/stars.js"></script>
</head>
<body>
<header id="nav"></header>
<main>
	<section class="filter-row">
    <div class="filter-dropdown">
        <img src="pictures/filter.svg" alt="Filter" class="filter-icon">
        <div class="filter-menu">
            <a href="#" class="filter-option">Nur bestandene Module</a><br>
            <a href="#" class="filter-option">Nur mit Bewertung</a>
        </div>
    </div>
    <input type="search" id="search" placeholder="Suche nach Modulen...">
</section>
	<section class= "modul-liste" id="modul-liste"></section>
	<template class="modul-template" id="modul-template">
		<a class="modul-link">
			<section class="modul">
				<section class="modul-bewertung">
					<h2 class="modul-name"></h2>
					<section class="modul-bewertung-value">
						<span class="fa fa-star-o"></span>
						<span class="fa fa-star-o"></span>
						<span class="fa fa-star-o"></span>
						<span class="fa fa-star-o"></span>
						<span class="fa fa-star-o"></span>
					</section>
				</section>
				<hr/>
				<section class="beschreibung-note">
					<p class="modul-beschreibung"></p>
					<h3 class="modul-note"></h3>
				</section>
			</section>
		</a>
	</template>
</main>
<footer>
	<h4>Webanwendungen 2 - Praktikum<br/>Backend Boys</h4>
	<a href="impressum.html">Impressum</a>
</footer>
</body>
</html>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        getNavbar()
        getData();
    });
    function getData() {
        ajaxGet("http://localhost:8000/api/modul/alle", (err, data) => {
            if (err) {
                console.log(err);
            } else {
                data = JSON.parse(data)
                console.log(data);
                const liste = document.getElementById('modul-liste');
                const template = document.getElementById('modul-template');

                for (let i = 0; i < data.length; i++) {
                    let modul = data[i];
                    const clone = template.content.cloneNode(true);
                    clone.querySelector('.modul-name').textContent = modul.Name;
                    clone.querySelector('.modul-beschreibung').textContent = modul.Inhalte;
                    clone.querySelector('.modul-link').href = `modul.html?id=${modul.id}`;
					
					// Score-basiert Sterne setzen
					const score = parseFloat(modul.Score);
					const stars = clone.querySelectorAll('.modul-bewertung-value .fa');
					setStarRating(score, stars);

                    liste.appendChild(clone);
                }
            }
        })
    }
	function getNavbar(){
        fetch('/navbar.html')
            .then(res => res.text())
            .then(html => document.getElementById('nav').innerHTML = html);
    }
    document.addEventListener("DOMContentLoaded", function () {
        const filterIcon = document.querySelector('.filter-icon');
        const filterMenu = document.querySelector('.filter-menu');

        if (filterIcon && filterMenu) {
            filterIcon.addEventListener('click', function(e) {
                e.stopPropagation();
                filterMenu.style.display = (filterMenu.style.display === "block") ? "none" : "block";
            });

            // Klick außerhalb schließt das Menü
            document.addEventListener('click', function(e) {
                if (!filterMenu.contains(e.target) && e.target !== filterIcon) {
                    filterMenu.style.display = "none";
                }
            });
        }
    });
</script>
