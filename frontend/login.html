<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset='utf-8'>
	<!--Google Fonts-->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap"
		  rel="stylesheet">
	<!---------------->
	<link rel='stylesheet' type='text/css' href='style/global_style.css'>
	<link rel='stylesheet' type='text/css' href='style/login_register_style.css'>
	<title>Uni-WOW</title>

	<script src="script/ajax.js"></script>
</head>
<body>
<main>
	<section class="login">
		<form id="login_form">
			<h1 style="text-align: center">Login</h1>
			<section>
				<input minlength="6" type="number" id="mnummer" name="mnummer" placeholder="Matrikelnummer" required/>
			</section>
			<section>
				<input type="password" id="passwort" name="passwort" placeholder="Passwort" required/>
			</section>
			<section>
				<button type="submit" id="login_button">Login</button>
			</section>
		</form>
	</section>
</main>
<footer>
	<h4>Webanwendungen 2 - Praktikum<br>Backend Boys</h4>
	<a href="impressum.html">Impressum</a>
</footer>
</body>
</html>
<script>
	document.getElementById("login_form").addEventListener("submit", (event) => {
		event.preventDefault()

		const matnr = document.getElementById('mnummer').value;
		const password = document.getElementById('passwort').value;

		const payload = {
			Matnr: matnr,
			Passwd: password
		};

		ajaxPost('http://localhost:8000/api/auth/login', payload, (err, response) => {
			if (err) {
				console.error(err);
				alert(err);
			} else {
				sessionStorage.setItem('JWT', JSON.parse(response).token);
				window.location.href = 'index.html';
			}
		});
	});
</script>
