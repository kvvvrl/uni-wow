<script>
    document.addEventListener("DOMContentLoaded", function(){
        getNavbar();
		getUser();
    })

	window.onload = function (){

	};

	function getUser(){
		ajaxGet(`http://localhost:8000/api/user/gib`, (err, data) => {
			if (err) {
				console.log(err);
				return;
			}

			data = JSON.parse(data);
			console.log(data);

			const form = document.getElementById('upper-form');
			const profil_upper_template = document.getElementById('profil-upper-template');
			const profil_upper = profil_upper_template.content.cloneNode(true);

			profil_upper.querySelector('.vname').value = data.Vorname;
			profil_upper.querySelector('.fname').value = data.Nachname;
			profil_upper.querySelector('.mnummer').value = data.Matnr;

			form.appendChild(profil_upper);
		});
	}

    function getNavbar(){
        fetch('./navbar.html')
            .then(res => res.text())
            .then(html => document.getElementById('nav').innerHTML = html);
    }
</script>
