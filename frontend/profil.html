<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8"/>
	<!--Google Fonts-->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap"
		  rel="stylesheet">
	<!---------------->
	<!--Font Awesome-->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<!---------------->
	<link rel="stylesheet" type="text/css" href="style/global_style.css"/>
	<link rel="stylesheet" type="text/css" href="style/profil_style.css"/>
	<title>Uni-WOW</title>

	<!-- JS-Files -->
	<script src="script/navbar.js"></script>
	<script src="script/ajax.js"></script>
	<script src="script/profil.js"></script>
</head>

<body>
<header id="nav"></header>
<main>
	<section>
		<form id="upper-form">
			<template id=profil-upper-template>
				<section class="profil-upper">
					<section class="image-container">
						<img class="picture" src="pictures/dummy.jpg"/>
						<section class="overlay" onclick="alert('Dummy Bild-Upload')">
							<i class="fa fa-upload icon" aria-hidden="true"></i>
						</section>
						<a href="#" id="logout-link" class="logout-link">Logout</a>
					</section>
					<section class="container">
						<section class="field">
							<input class="vname" type="text" id="pvname" name="vname" placeholder="Vorname">
							<input class="fname" type="text" id="pnname" name="fname" placeholder="Nachname">
						</section>
						<section class="field">
							<input class="mnummer" type="number" id="mnummer" name="mnummer" readonly placeholder="Matrikelnummer: 106342" disabled>
						</section>
						<section class="field">
							<input type="password" id="password" name="password" placeholder="Passwort" required/>
						</section>
						<section class="field">
							<input type="password" id="password-repeat" name="password-repeat" placeholder="Passwort Wiederholen" required/>
						</section>
						<section class="speichern">
							<input type="submit" value="Speichern">
						</section>
					</section>
				</section>
			</template>
		</form>
			<section class="profil-lower">
				<section class="noten-liste">
					<table id="noten-tabelle">
						<tr>
							<th>Modul</th>
							<th>ECTS</th>
							<th>Note</th>
						</tr>
						<template id="noten-zeile">
							<tr>
								<td class="modul-name"></td>
								<td class="modul-ects"></td>
								<td class="modul-note"></td>
							</tr>
						</template>
					</table>
				</section>
				<section class="profil-infos">
					<table>
						<tr>
							<td><h2>Notendurchschnitt:</h2></td>
							<td><h2 id="durchschnitt" class="wert">2.5</h2></td>
						</tr>
						<tr>
							<td><h2>Gesammelte ECTS:</h2></td>
							<td><h2 id="credits" class="wert">15</h2></td>
						</tr>
					</table>
				</section>
			</section>
	</section>
</main>
<footer>
	<h4>Webanwendungen 2 - Praktikum<br>Backend Boys</h4>
	<a href="impressum.html">Impressum</a>
</footer>
</body>

</html>
