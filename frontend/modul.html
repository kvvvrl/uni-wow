<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset='utf-8'>
	<!--Google Fonts-->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap"
		  rel="stylesheet">
	<!---------------->
	<!--Font Awesome-->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<!---------------->
	<link rel="stylesheet" type='text/css' href="style/global_style.css">
	<link rel="stylesheet" type='text/css' href="style/moduldetail_style.css">
	<title>Uni-WOW</title>

	<!--Script für Nav-->
	<script src="script/navbar.js"></script>
	<script src="script/ajax.js"></script>
	<script src="script/stars.js"></script>
</head>
<body>
<header id="nav">
</header>
<main class="moduldetail" id="moduldetail">
	<h1 class="ueberschrift" id="ueberschrift"></h1>
	<section class="modul-infos" id="modul-infos">
	</section>
	<template class="modul-detail-template" id="modul-detail-template">
		<section class="modul">
			<section class="modul-info">
				<h3>Modulverantwortlicher:</h3>
				<p class="modul-verantwortlicher"></p>
				<h3>Workload:</h3>
				<p class="modul-workload"></p>
				<h3>Credits:</h3>
				<p class="modul-credits"></p>
				<h3>Lernergebnisse:</h3>
				<p class="modul-lernergebnisse"></p>
				<h3>Inhalte:</h3>
				<p class="modul-inhalte"></p>
				<h3>Pr&uuml;fungsform:</h3>
				<p class="modul-pruefungsform"></p>
			</section>
			<section class="modul-bewertung">
				<form id="bewertungs-form" class="fields">
					<section>
						<h3><label for="note">Note:</label></h3>
						<select class="note" name="note" id="note">
							<option value="1">1</option>
							<option value="1.3">1.3</option>
							<option value="1.7">1.7</option>
							<option value="2">2</option>
							<option value="2.3">2.3</option>
							<option value="2.7">2.7</option>
							<option value="3">3</option>
							<option value="3.3">3.3</option>
							<option value="3.7">3.7</option>
							<option value="4">4</option>
							<option value="4.3">4.3</option>
							<option value="4.7">4.7</option>
							<option value="5">5</option>
						</select>
					</section>
					<section class="bewertung">
						<h3><label for="bewertung">Bewertung:</label></h3>
						<textarea id="bewertung" rows="10" cols="30"></textarea>
						<section class="star-rating">
							<span class="star-user fa fa-star star"></span>
							<span class="star-user fa fa-star star"></span>
							<span class="star-user fa fa-star star"></span>
							<span class="star-user fa fa-star star"></span>
							<span class="star-user fa fa-star star"></span>
						</section>
						<button type="submit" class="save" id="eingabe">Speichern</button>
					</section>
				</form>
			</section>
		</section>
	</template>
	<hr>
	<section class="bewertungsliste" id="bewertungsliste">
		<template class="kommentar-template" id="kommentar-template">
			<section class="kommentar">
				<section class="benutzer-info">
					<img alt="profilbild" class="profilepicture" src="pictures/dummy.jpg"/>
					<strong class="benutzername"></strong>
				</section>
				<section class="inhalt">
					<section class="bewertungstext"></section>
					<section class="bewertungsvalue">
						<span class="fa fa-star star"></span>
						<span class="fa fa-star star"></span>
						<span class="fa fa-star star"></span>
						<span class="fa fa-star star"></span>
						<span class="fa fa-star star"></span>
					</section>
				</section>
			</section>
		</template>
	</section>
</main>
</body>
<footer>
	<h4>Webanwendungen 2 - Praktikum<br>Backend Boys</h4>
	<a href="impressum.html">Impressum</a>
</footer>
</html>
<script>
	document.addEventListener('DOMContentLoaded', () => {
		const params = new URLSearchParams(window.location.search);
		const id = params.get('id');
		getModulData(id);
		getKommentarData(id);

		// Sternebewertung: globales Click-Handling
		document.addEventListener('click', function (e) {
			if (
					e.target.classList.contains('star') &&
					e.target.closest('.star-rating')
			) {
				const starsrate = Array.from(document.querySelectorAll('.star-rating .fa-star'));
				selectedScore = starsrate.indexOf(e.target) + 1;

				starsrate.forEach((star, index) => {
					star.classList.toggle('checked', index < selectedScore);
				});
			}
		});
	});

	let selectedScore = 0; // global, damit überall verfügbar

	function getModulData(id) {
		ajaxGet(`http://localhost:8000/api/modul/gib/${id}`, (err, data) => {
			if (err) {
				console.log(err);
				return;
			}

			data = JSON.parse(data);
			document.getElementById('ueberschrift').textContent = data.Name;

			const infos = document.getElementById('modul-infos');
			const modul_template = document.getElementById('modul-detail-template');
			const modul = modul_template.content.cloneNode(true);

			modul.querySelector('.modul-verantwortlicher').textContent = `${data.Verantwortlicher.Vorname} ${data.Verantwortlicher.Nachname}`;
			modul.querySelector('.modul-workload').textContent = data.Workload;
			modul.querySelector('.modul-credits').textContent = data.Credits;
			modul.querySelector('.modul-lernergebnisse').textContent = data.Lernergebnisse;
			modul.querySelector('.modul-inhalte').textContent = data.Inhalte;
			modul.querySelector('.modul-pruefungsform').textContent = data.Pruefungsform;

			modul.querySelector('.note').value = data.UserData.Note;
            
            if(data.UserData.Bewertung) {
                const stars = Array.from(modul.querySelectorAll('.star-user'));
                stars.forEach((star, index) => {
                    star.classList.toggle('checked', index < data.UserData.Bewertung.Score);
                });

                modul.getElementById('bewertung').value = data.UserData.Bewertung.Inhalt;
                modul.querySelector('.save').innerText = 'Aktualisieren';
				selectedScore = data.UserData.Bewertung.Score
			}

			infos.appendChild(modul);

			document.getElementById("bewertungs-form").addEventListener("submit", (event) => {
				event.preventDefault();

				const note = parseFloat(document.getElementById('note').value);
				const bewertung = document.getElementById('bewertung').value;

				if (bewertung.trim() === '') {
					alert('Bitte geben Sie eine Bewertung ein.');
					return;
				}
				if (selectedScore === 0) {
					alert('Bitte vergeben Sie eine Sternebewertung.');
					return;
				}

				const payload = {
					Modul_id: parseInt(id),
					Note: note,
					Inhalt: bewertung,
					Score: selectedScore
				};

				ajaxPost('http://localhost:8000/api/bewertung', payload, (err, response) => {
					if (err) {
						console.error(err);
						alert('Fehler beim Speichern der Bewertung.');
						return;
					}
				});
				location.reload();
			});
		});
	}

	function getKommentarData(id) {
		ajaxGet(`http://localhost:8000/api/bewertungen/modul/gib/${id}`, (err, data) => {
			if (err) {
				console.log(err);
				return;
			}
			data = JSON.parse(data);
			const kommentare = document.getElementById('bewertungsliste');
			const kommentar_template = document.getElementById('kommentar-template');

			for (let komment of data) {
				const fragment = kommentar_template.content.cloneNode(true);
				const kommentar = fragment.querySelector('.kommentar'); // jetzt echtes Element

				kommentar.querySelector('.benutzername').textContent = `${komment.Vorname} ${komment.Nachname}`;
				kommentar.querySelector('.bewertungstext').textContent = `${komment.Inhalt}`;

				// Score-basiert Sterne setzen
				const score = parseFloat(komment.Score);
				const stars = kommentar.querySelectorAll('.bewertungsvalue span.fa');
				if (stars.length === 5 && !isNaN(score)) {
					setStarRating(score, stars);
				} else {
					console.warn("Score/Stars fehlen:", komment, stars);
				}

				kommentare.appendChild(fragment); // GANZ ZUM SCHLUSS anhängen
			}
		});
	}
</script>
