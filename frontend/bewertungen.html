<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8"/>
	<!--Google Fonts-->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap"
		  rel="stylesheet">
	<!---------------->
	<!--Font Awesome-->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<!---------------->
	<link rel="stylesheet" type="text/css" href="style/global_style.css"/>
	<link
			rel="stylesheet"
			type="text/css"
			href="style/bewertunguebersicht_style.css"
	/>
	<title>Meine Bewertungen</title>

	<script src="script/navbar.js"></script>
	<script src="script/ajax.js"></script>
	<script src="script/stars.js"></script>
</head>
<body>
<header id="nav">
</header>
<main>
	<section class="bewertungsliste" id="bewertungsliste">
		<template class="kommentar-template" id="kommentar-template">
			<section class="kommentar">
				<section class="benutzer-info">
					<strong class="modul"></strong>
					<i class="fa fa-pencil-square-o" aria-hidden="true"></i>
				</section>
				<section class="inhalt">
					<section class="bewertungstext"><textarea class="bewertungstext-input" rows="1" disabled></textarea></section>
					<section class="bewertungsvalue">
						<span class="fa fa-star-o"></span>
						<span class="fa fa-star-o"></span>
						<span class="fa fa-star-o"></span>
						<span class="fa fa-star-o"></span>
						<span class="fa fa-star-o"></span>
					</section>
				</section>
				<section class="link">
					<a class="modul-link">zum Modul<i class="fa fa-share" aria-hidden="true"></i></a>
				</section>
			</section>
		</template>
	</section>
</main>
<footer>
	<h4>Webanwendungen 2 - Praktikum<br>Backend Boys</h4>
	<a href="impressum.html">Impressum</a>
</footer>
</body>
</html>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        getNavbar()
        getData(123456)
    });
    function getData(id) {
        ajaxGet(`http://localhost:8000/api/bewertungen/user/gib/${id}`, (err, data) => {
            if (err) {
                console.log(err);
            } else {
                data = JSON.parse(data)
                console.log(data);

                const kommentare = document.getElementById('bewertungsliste')
                const kommentar_template = document.getElementById('kommentar-template')
                for (let i = 0; i < data.length; i++) {
					const komment = data[i];

					// Fragment klonen
					const fragment = kommentar_template.content.cloneNode(true);
					const kommentar = fragment.querySelector('.kommentar'); // echtes DOM-Element im Fragment

					kommentar.querySelector('.modul').textContent = komment.Name;
					//kommentar.querySelector('.bewertungstext').textContent = komment.Inhalt;
					kommentar.querySelector('.modul-link').href = `modul.html?id=${komment.id}`;

					// Score-basiert Sterne setzen
					const score = parseFloat(komment.Score);
					const stars = kommentar.querySelectorAll('.bewertungsvalue span.fa');
					if (stars.length === 5 && !isNaN(score)) {
						setStarRating(score, stars);
					} else {
						console.warn("Score/Stars fehlen:", komment, stars);
					}

					// Fragment anhängen
					kommentare.appendChild(fragment);

					// Event Listener für den Edit-Button
					const editBtn = kommentar.querySelector('.fa-pencil-square-o');
					const bewertungTextSection = kommentar.querySelector('.bewertungstext');
					const bewertungInput = bewertungTextSection.querySelector('.bewertungstext-input');

					bewertungInput.value = komment.Inhalt;

					editBtn.addEventListener('click', function(){
						bewertungInput.disabled = false;
						bewertungInput.focus();
						bewertungInput.style.height = "auto";
						bewertungInput.style.height = bewertungInput.scrollHeight + "px";
						bewertungInput.addEventListener('input', function() {
							this.style.height = "auto";
							this.style.height = this.scrollHeight + "px";
						});
						bewertungInput.addEventListener('blur', function () {
							bewertungInput.disabled = true;
						});
					});
				}

            }
        })
    }

    function getNavbar(){
        fetch('./navbar.html')
            .then(res => res.text())
            .then(html => document.getElementById('nav').innerHTML = html);
    }
</script>
